<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ананасики — mini app v0.1</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="card">
        <h1>🍍 Ананасики</h1>
        <p>30 ананасиков = 1 ₽</p>
      </header>

      <section class="card balance">
        <h2>Баланс</h2>
        <div class="value-row">
          <span id="pineappleCount">0</span>
          <span class="unit">🍍</span>
        </div>
        <p>~ <span id="rubAmount">0.00</span> ₽</p>
      </section>

      <section class="card earn">
        <h2>Заработок</h2>
        <p>Доступный способ в v0.1: просмотр рекламы.</p>
        <button id="watchAdBtn" class="primary">Смотреть рекламу (+3 🍍)</button>
        <small id="adStatus">Реклама доступна</small>
      </section>

      <section class="card log">
        <h2>Последние действия</h2>
        <ul id="activityList"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
